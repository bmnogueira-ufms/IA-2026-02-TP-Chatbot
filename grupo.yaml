# =============================================================================
#  CONFIGURAÇÃO DO GRUPO - preencha todos os campos marcados com TODO.
#  Este arquivo é lido pelo código base, pelo notebook e pelo script de
#  avaliação. Mantenha a estrutura (nomes das chaves) exatamente como está.
#  Veja um exemplo completo em exemplos/biblioteca/grupo.yaml.
# =============================================================================

grupo:
  nome: "MAIA"
  integrantes: # 3 a 4 integrantes
    - nome: "Amanda Beatriz Carvalho de Jesus"
      rga: "2024.1906.035-8"
    - nome: "Ana Beatriz de Araujo Leite"
      rga: "2024.1906.077-3"
    - nome: "Isabela Fernandes Lopes"
      rga: "2024.1906.017-0"
    - nome: "Maria Eduarda da Silva Gonçalves"
      rga: "2024.1906.026-9"

tema:
  nome: "Esportes na UFMS"
  descricao: >
    Este bot serve de apoio para a comunidade da UFMS que precisa de apoio em temas 
    esportivos oferecidos pela universidade.

dados: # caminhos relativos a este arquivo - não altere
  treino: dados/treino.csv
  teste: dados/teste.csv

modelos: # caminhos relativos a este arquivo - não altere
  escopo: modelos/escopo.joblib
  tema: modelos/tema.joblib
  # carregador: "chatbot.meu_modulo:carregar"   # opcional; ver chatbot/modelos.py

# LLM que REDIGE as respostas do bot (via OpenRouter, com a chave do grupo).
# Os classificadores decidem a ROTA; o LLM só escreve o texto da resposta.
llm:
  modelo: "openai/gpt-6-luna" # ou o modelo indicado pelo professor
  temperatura: 0.3 # 0 = respostas mais estáveis; 1 = mais variadas
  max_tokens: 300
  usar_em: [intencoes, chitchat] # nós em que o LLM redige a resposta
  persona: >
    "Você é a Maia, assistente virtual de esportes da UFMS. Seja cordial, simples 
    e com personalidade enérgica."
  contato: "PROECE, DIEL, diel.proece@ufms.br, gab.proece@ufms.br"
  max_frases: 3
  turnos_historico: 3

# Base de conhecimento (RAG). Coloque os documentos oficiais do tema em
# documentos/ (uma subpasta por intenção + geral/). O índice vetorial é criado
# automaticamente em .vectordb/ na primeira conversa com o LLM.
conhecimento:
  pasta: documentos
  representacao: tfidf # tfidf (padrão) ou embeddings
  tamanho_trecho: 700
  k: 4
  similaridade_minima: 0.05

roteamento:
  # Abaixo desta confiança no tema, o bot pede esclarecimento em vez de responder.
  # 0 desliga o recurso. Escolha o valor com base em dados e justifique no relatório.
  limiar_tema: 0.0

# De 5 a 10 intenções. O nome (chave) deve ter só letras minúsculas sem acento,
# dígitos e "_". "descricao" aparece nas mensagens do bot ("Posso ajudar com: ...").
intencoes:
  modalidades_treinos:
    descricao: "modalidades oferecidas, turmas e horários de treino"
    resposta: >
      A UFMS oferece atividades esportivas como natação, ciclismo, futevôlei,
      corrida de rua e taekwondo, em turmas com dias, horários e vagas
      definidos por modalidade. A tabela do semestre é publicada no Boletim
      Oficial da UFMS e no site da Proece em https://proece.ufms.br/treinamento-e-lazer-cidade-universitaria/.

  inscricao_programa:
    descricao: "como se inscrever nas turmas do Programa Universitário de Lazer, Saúde e Esporte"
    resposta: >
      As inscrições nas turmas seguem o edital de cada semestre, divulgado pela
      Proece em https://proece.ufms.br/programa-esporte-universitario/. Cada turma indica o público (estudantes,
      servidores) e o nível (iniciante, intermediário ou avançado).

  atleticas:
    descricao: "atléticas, cadastro e fomento"
    resposta: >
      As atléticas da UFMS são cadastradas na DICE/Proece, que também acompanha
      e orienta as associações. Editais de fomento de materiais esportivos são
      publicados periodicamente no site da Proece (https://proece.ufms.br/), 
      como o EDITAL Nº 258/2026-PROECE/UFMS (Seleção para concessão de Apoio 
      para Cadastro de Associações Atléticas Acadêmicas da UFMS).

  competicoes_jogos:
    descricao: "competições, jogos universitários e Copa Interatléticas"
    resposta: >
      A UFMS apoia a participação de estudantes em competições locais,
      regionais e nacionais, como os Jogos Universitários, além de torneios
      entre atléticas dos câmpus. Calendários e resultados são divulgados 
      nos canais oficiais da Diretoria de Esporte e Lazer em https://proece.ufms.br/ 
      e pelas redes sociais da Liga das Atléticas da UFMS (LAUFMS).

  apoio_atletas:
    descricao: "apoio e bolsas para estudantes-atletas"
    resposta: >
      A UFMS publica editais de apoio a estudantes-atletas que competem em
      eventos esportivos oficiais. Os critérios e prazos estão definidos no
      Edital nº 257/2026-PROECE/UFMS (Bolsa Atleta do PULSE UFMS), que pode 
      ser consultado no portal de editais da Proece em https://proece.ufms.br/.

  espacos_esportivos:
    descricao: "locais de treino: quadras, complexo aquático e quadras de areia"
    resposta: >
      Os treinos ocorrem em espaços da Cidade Universitária, como o Complexo
      Aquático e as quadras de areia. O uso dos espaços por atléticas é
      organizado pela Proece, e o agendamento é realizado através do formulário 
      disponibilizado em https://proece.ufms.br/diretorias/diel/agendas/.

  contato_proece:
    descricao: "contato da Proece e dúvidas gerais sobre esportes"
    resposta: >
      Para falar com a Secretaria de Esportes (SEPES/DICE/Proece), use o
      e-mail sepes.proece@ufms.br ou o telefone (67) 3345-7248.

# Respostas dos nós que não são intenções. {assuntos} vira a lista de descrições
# das intenções; {opcao1}/{opcao2}, as duas intenções mais prováveis.
respostas:
  chitchat:
    saudacao: "Olá! Como posso ajudar?"
    agradecimento: "Por nada!"
    despedida: "Até logo!"
    padrao: "Sou um assistente automático e posso ajudar com: {assuntos}."
  fora_dominio: "Desculpe, não sei responder sobre isso. Posso ajudar com: {assuntos}."
  esclarecer: "Não tenho certeza se entendi. Sua dúvida é sobre {opcao1} ou sobre {opcao2}?"
